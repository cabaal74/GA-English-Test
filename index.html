<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111d">
<title>Frequência Cardíaca</title>
<style>
:root{
  --bg:#07111d;
  --panel:#0d1826;
  --panel2:#101c2b;
  --line:#2a394d;
  --text:#f7f9fc;
  --muted:#aab4c5;
  --green1:#2a9f52; --green2:#237a43;
  --blue1:#347ee9; --blue2:#2c62c8;
  --purple1:#9b3dde; --purple2:#7c2eb9;
  --red1:#ff4036; --red2:#dc302b;
}
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
body{
  padding:max(14px,env(safe-area-inset-top)) 12px max(22px,env(safe-area-inset-bottom));
}
.app{width:100%;max-width:560px;margin:0 auto}
.hero{padding:2px 12px 18px}
h1{
  margin:0 0 10px;
  font-size:clamp(28px,7.3vw,38px);
  line-height:1.05;
  font-weight:800;
  letter-spacing:-.02em
}
.subtitle{
  margin:0;
  color:var(--muted);
  font-size:clamp(16px,4.2vw,19px);
  line-height:1.38
}
.card{
  width:100%;
  border:1px solid var(--line);
  border-radius:20px;
  background:linear-gradient(180deg,#111d2b,#0b1521);
  box-shadow:0 10px 30px rgba(0,0,0,.16)
}
.form-card{padding:18px 16px}
.date-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:12px
}
.field{min-width:0;margin-bottom:18px}
label{
  display:block;
  margin:0 0 8px;
  font-size:15px;
  font-weight:800
}
input{
  width:100%;
  min-width:0;
  height:44px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#09131f;
  color:var(--text);
  outline:none;
  font-size:15px;
  padding:0 12px
}
input:focus{border-color:#4d6b91}
.date-control{
  height:44px;
  font-size:13px;
  padding:0 8px;
  overflow:hidden
}
.date-control::-webkit-date-and-time-value{
  text-align:left;
  min-width:0
}
.divider{
  height:1px;
  background:#223145;
  margin:0 0 18px
}
.segment{
  display:grid;
  grid-template-columns:1fr 1fr;
  border:1px solid var(--line);
  border-radius:13px;
  overflow:hidden;
  background:#0b1521
}
.segment button{
  height:54px;
  border:0;
  background:transparent;
  color:var(--text);
  font-size:16px;
  font-weight:700
}
.segment button.active{background:#1a2637}
.coffee-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px
}
.coffee-controls{
  display:grid;
  grid-template-columns:58px minmax(110px,150px) 58px;
  gap:14px;
  align-items:center;
  justify-content:center;
  width:100%
}
.step{
  width:58px;
  height:56px;
  border:0;
  border-radius:15px;
  background:linear-gradient(135deg,var(--red1),var(--red2));
  color:#fff;
  font-size:30px;
  line-height:1;
  touch-action:manipulation
}
.coffee-count{
  height:56px;
  text-align:center;
  font-size:22px;
  font-weight:800;
  padding:0 8px
}
.unit{color:var(--muted);font-size:13px}
.actions{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin:16px 0
}
.action{
  min-width:0;
  height:52px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  color:#fff;
  font-size:13px;
  font-weight:800;
  padding:0 8px;
  touch-action:manipulation;
  white-space:nowrap
}
.save{background:linear-gradient(135deg,var(--green1),var(--green2))}
.summary-btn{background:linear-gradient(135deg,var(--blue1),var(--blue2))}
.export{background:linear-gradient(135deg,var(--purple1),var(--purple2))}
.summary-card{padding:18px 16px}
.summary-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px
}
.summary-title{font-size:20px;font-weight:800}
.refresh{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:23px;
  padding:4px 6px
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px
}
.stat{
  border:1px solid #223145;
  border-radius:14px;
  background:#0f1a28;
  padding:15px 6px;
  text-align:center
}
.stat .icon{display:block;font-size:22px;margin-bottom:7px}
.stat b{display:block;font-size:28px;line-height:1}
.stat small{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:7px
}
.history{display:none;margin-top:12px}
.history.show{display:block}
.item{border-top:1px solid #223145;padding:12px 2px}
.item:first-child{border-top:0}
.meta{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  margin-top:4px
}
.delete{
  margin-top:7px;
  border:0;
  border-radius:9px;
  background:#2d1720;
  color:#ff98a3;
  padding:7px 9px
}
.footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
  padding:18px 10px 2px
}

/* iPhone compact layout: preserve the SAME structure as the reference */
@media(max-width:430px){
  body{padding-left:10px;padding-right:10px}
  .app{max-width:none}
  .hero{padding:2px 8px 16px}
  h1{font-size:29px}
  .subtitle{font-size:16px}
  .form-card{padding:14px 12px}
  .date-row{gap:8px}
  .date-control{height:38px;font-size:11px;padding:0 4px}
  label{font-size:14px}
  input{height:42px;font-size:14px;padding-left:10px;padding-right:10px}
  .segment button{height:46px;font-size:14px}
  .coffee-controls{
    grid-template-columns:48px minmax(92px,124px) 48px;
    gap:10px
  }
  .step{width:48px;height:48px;font-size:26px}
  .coffee-count{height:48px;font-size:19px}
  .actions{gap:8px}
  .action{
    height:46px;
    font-size:11px;
    padding:0 4px
  }
  .summary-card{padding:16px 14px}
  .summary-title{font-size:19px}
  .stats{gap:7px}
  .stat{padding:13px 4px}
  .stat b{font-size:25px}
  .stat small{font-size:11px}
}

@media(max-width:390px){
  body{padding-left:8px;padding-right:8px}
  .form-card{padding:12px 10px}
  .date-row{gap:6px}
  .date-control{height:36px;font-size:10px;padding:0 3px}
  label{font-size:13px}
  input{height:40px;font-size:13px;padding:0 9px}
  .segment button{height:44px;font-size:13px}
  .coffee-controls{grid-template-columns:46px minmax(84px,116px) 46px;gap:8px}
  .step{width:46px;height:46px;font-size:24px}
  .coffee-count{height:46px;font-size:18px}
  .actions{gap:6px}
  .action{height:44px;font-size:10px;padding:0 2px}
}


/* Responsive mobile hardening */
html, body { width:100%; max-width:100%; overflow-x:hidden; }
.app, .card, .form-card, .field, .date-row, .actions, .stats, .coffee-controls { min-width:0; max-width:100%; }
input, button { min-width:0; max-width:100%; }

/* iOS native date/time controls can have a large intrinsic width.
   On phones we stack them vertically to guarantee zero overlap. */
@media (max-width: 430px){
  body{
    padding-left:8px;
    padding-right:8px;
  }

  .app{
    width:100%;
    max-width:100%;
  }

  .hero{
    padding:2px 6px 14px;
  }

  h1{
    font-size:28px;
  }

  .subtitle{
    font-size:16px;
  }

  .form-card{
    width:100%;
    padding:14px 12px;
    overflow:hidden;
  }

  .date-row{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    width:100%;
  }

  .date-row .field{
    width:100%;
    margin-bottom:0;
  }

  .date-row .field:last-child{
    margin-bottom:16px;
  }

  .date-control{
    display:block;
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
    height:42px;
    font-size:14px;
    padding:0 10px;
    overflow:hidden;
  }

  input{
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
    height:44px;
    font-size:14px;
    padding-left:10px;
    padding-right:10px;
  }

  .segment{
    width:100%;
  }

  .segment button{
    height:46px;
    font-size:14px;
  }

  .coffee-controls{
    width:100%;
    grid-template-columns:48px minmax(0,1fr) 48px;
    gap:10px;
  }

  .step{
    width:48px;
    height:48px;
    font-size:25px;
  }

  .coffee-count{
    width:100% !important;
    height:48px;
    font-size:18px;
  }

  .actions{
    width:100%;
    grid-template-columns:1fr;
    gap:9px;
  }

  .action{
    width:100%;
    height:46px;
    font-size:13px;
    white-space:normal;
  }

  .summary-card{
    width:100%;
    padding:14px 12px;
  }

  .stats{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:6px;
  }

  .stat{
    min-width:0;
    padding:11px 3px;
  }

  .stat b{
    font-size:22px;
  }

  .stat small{
    font-size:10px;
  }
}

@media (min-width: 431px) and (max-width: 700px){
  .date-row{
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  }

  .actions{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

</style>
</head>
<body>
<main class="app">
  <section class="hero">
    <h1>❤️ Frequência Cardíaca</h1>
    <p class="subtitle">Registro simples para acompanhar batimentos, repouso e consumo de café.</p>
  </section>

  <section class="card form-card">
    <div class="date-row">
      <div class="field">
        <label for="date">Data</label>
        <input id="date" class="date-control" type="date">
      </div>
      <div class="field">
        <label for="time">Hora</label>
        <input id="time" class="date-control" type="time">
      </div>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label for="bpm">Frequência Cardíaca (bpm)</label>
      <input id="bpm" type="number" inputmode="numeric" min="30" max="250" placeholder="Ex.: 72">
    </div>

    <div class="divider"></div>

    <div class="field">
      <label>Repouso</label>
      <div class="segment">
        <button id="restYes" type="button" onclick="setRest(true)">🌙 Sim</button>
        <button id="restNo" type="button" onclick="setRest(false)">☀️ Não</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="field" style="margin-bottom:0">
      <label>Café consumido</label>
      <div class="coffee-wrap">
        <div class="coffee-controls">
          <button class="step" type="button" onclick="coffeeDown()">−</button>
          <input id="coffee" class="coffee-count" type="number" inputmode="numeric" min="0" max="20" value="0">
          <button class="step" type="button" onclick="coffeeUp()">+</button>
        </div>
        <div class="unit">Xícaras</div>
      </div>
    </div>
  </section>

  <section class="actions">
    <button class="action save" type="button" onclick="saveRecord()">💾 Salvar Registro</button>
    <button class="action summary-btn" type="button" onclick="toggleHistory()">📊 Ver Resumos</button>
    <button class="action export" type="button" onclick="exportCSV()">⇩ Exportar CSV</button>
  </section>

  <section class="card summary-card">
    <div class="summary-head">
      <div class="summary-title">📅 Resumo de Hoje</div>
      <button class="refresh" type="button" onclick="render()">↻</button>
    </div>

    <div class="stats">
      <div class="stat"><span class="icon">❤️</span><b id="todayCount">0</b><small>Registros</small></div>
      <div class="stat"><span class="icon">☕</span><b id="todayCoffee">0</b><small>Xícaras</small></div>
      <div class="stat"><span class="icon">📈</span><b id="todayAvg">0</b><small>Média (bpm)</small></div>
    </div>

    <div id="history" class="history"></div>
  </section>

  <footer class="footer">
    ♡ Cuide do seu coração todos os dias!<br>
    🔒 Dados salvos apenas neste dispositivo.
  </footer>
</main>

<script>
const KEY="fc_records_v11";
let records=[];
let rest=true;

function byId(id){return document.getElementById(id)}

function setNow(){
  const d=new Date();
  const local=new Date(d.getTime()-d.getTimezoneOffset()*60000);
  byId("date").value=local.toISOString().slice(0,10);
  byId("time").value=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

function setRest(value){
  rest=value;
  byId("restYes").classList.toggle("active",rest);
  byId("restNo").classList.toggle("active",!rest);
}

function coffeeDown(){
  const el=byId("coffee");
  el.value=Math.max(0,(parseInt(el.value,10)||0)-1);
}

function coffeeUp(){
  const el=byId("coffee");
  el.value=Math.min(20,(parseInt(el.value,10)||0)+1);
}

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    records=raw?JSON.parse(raw):[];
    if(!Array.isArray(records))records=[];
  }catch(e){records=[]}
  render();
}

function todayISO(){
  const d=new Date();
  const local=new Date(d.getTime()-d.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,10);
}

function saveRecord(){
  const bpm=parseInt(byId("bpm").value,10);
  if(Number.isNaN(bpm)){alert("Informe a frequência cardíaca em BPM.");return}
  if(bpm<30||bpm>250){alert("Informe um BPM entre 30 e 250.");return}

  records.unshift({
    id:Date.now(),
    date:byId("date").value,
    time:byId("time").value,
    bpm:bpm,
    rest:rest,
    coffee:parseInt(byId("coffee").value,10)||0
  });

  localStorage.setItem(KEY,JSON.stringify(records));
  byId("bpm").value="";
  byId("coffee").value="0";
  render();
  alert("Registro salvo.");
}

function render(){
  const today=todayISO();
  const todayRecords=records.filter(r=>r.date===today);
  const count=todayRecords.length;
  const coffee=todayRecords.reduce((s,r)=>s+(Number(r.coffee)||0),0);
  const avg=count?Math.round(todayRecords.reduce((s,r)=>s+(Number(r.bpm)||0),0)/count):0;

  byId("todayCount").textContent=count;
  byId("todayCoffee").textContent=coffee;
  byId("todayAvg").textContent=avg;

  const history=byId("history");
  if(!records.length){
    history.innerHTML='<div class="item"><div class="meta">Nenhum registro salvo ainda.</div></div>';
    return;
  }

  history.innerHTML=records.map(r=>`
    <div class="item">
      <strong>${esc(r.bpm)} bpm</strong>
      <div class="meta">${formatDate(r.date)} às ${esc(r.time)} • ${r.rest?"Repouso":"Atividade"} • ☕ ${esc(r.coffee)} xícara(s)</div>
      <button class="delete" type="button" onclick="deleteRecord(${Number(r.id)})">Excluir</button>
    </div>
  `).join("");
}

function toggleHistory(){byId("history").classList.toggle("show")}

function deleteRecord(id){
  records=records.filter(r=>Number(r.id)!==Number(id));
  localStorage.setItem(KEY,JSON.stringify(records));
  render();
}

function formatDate(v){
  if(!v)return"";
  const p=v.split("-");
  return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v;
}

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function exportCSV(){
  if(!records.length){alert("Não há registros para exportar.");return}

  const rows=[["Data","Hora","BPM","Repouso","Café consumido"]];
  records.forEach(r=>rows.push([formatDate(r.date),r.time,r.bpm,r.rest?"Sim":"Não",r.coffee]));

  const csv="\ufeff"+rows.map(row=>
    row.map(cell=>`"${String(cell??"").replace(/"/g,'""')}"`).join(";")
  ).join("\r\n");

  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="registros_frequencia_cardiaca.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),500);
}

setNow();
setRest(true);
load();
</script>
</body>
</html>
